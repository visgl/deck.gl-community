name: Restore built workspace packages
description: Extract the package outputs produced for this workflow run.
runs:
  using: composite
  steps:
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: package-build
        path: ${{ runner.temp }}
    - shell: bash
      run: tar -xf "$RUNNER_TEMP/package-build.tar"
