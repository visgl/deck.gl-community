name: Install CI browser
description: Install a Playwright browser and its system dependencies using the Ubuntu archive.
inputs:
  browser:
    description: Playwright browser to install.
    default: chromium
runs:
  using: composite
  steps:
    - name: Use the Ubuntu package archive
      shell: bash
      run: |
        # Regional mirrors can take minutes to serve Playwright's fonts and libraries.
        # Hosted runners also select mirrors through file-based mirror lists.
        for source in /etc/apt/apt-mirrors*.txt /etc/apt/sources.list /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources; do
          if [[ -f "$source" ]]; then
            echo "Configuring Ubuntu archive in $source"
            sudo sed -E -i 's@https?://(azure|[[:alnum:]-]+\.ec2)\.archive\.ubuntu\.com/ubuntu([[:space:]/]|$)@https://archive.ubuntu.com/ubuntu\2@g' "$source"
          fi
        done

    - name: Install Playwright browser
      shell: bash
      run: yarn playwright install --with-deps "$PLAYWRIGHT_BROWSER"
      env:
        PLAYWRIGHT_BROWSER: ${{ inputs.browser }}
