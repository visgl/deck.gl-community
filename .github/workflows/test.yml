name: test

on:
  push:
    branches:
      - master
  pull_request:

# Superseded PR revisions share a group; master runs remain independent.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-26.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Enable Corepack
        run: corepack enable yarn

      - name: Install dependencies
        run: yarn install --immutable
        env:
          YARN_ENABLE_HARDENED_MODE: 0

      - name: Lint
        run: yarn lint

  test-node:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      actions: read
      issues: write
      pull-requests: write
      checks: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Enable Corepack
        run: corepack enable yarn

      - name: Install dependencies
        run: yarn install --immutable
        env:
          YARN_ENABLE_HARDENED_MODE: 0

      - name: Build packages
        run: yarn build

      - name: Compile strict public API consumers
        run: yarn test-types

      - name: Run node tests with coverage
        run: yarn test-ci --maxWorkers=2 2>&1 | tee /tmp/coverage.txt; exit ${PIPESTATUS[0]}

      - name: Save coverage summary
        if: always()
        run: grep -m1 "^All files" /tmp/coverage.txt > /tmp/coverage-summary.txt || true

      - name: Upload coverage baseline
        if: github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-baseline
          path: /tmp/coverage-summary.txt
          retention-days: 90

      - name: Find latest master run with baseline
        if: github.event_name == 'pull_request'
        id: find-baseline
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          result-encoding: string
          script: |
            const runs = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'test.yml',
              branch: 'master',
              status: 'success',
              per_page: 5,
            });
            for (const run of runs.data.workflow_runs) {
              const {data} = await github.rest.actions.listWorkflowRunArtifacts({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: run.id,
              });
              if (data.artifacts.find(a => a.name === 'coverage-baseline')) {
                return String(run.id);
              }
            }
            return '';

      - name: Download coverage baseline
        if: github.event_name == 'pull_request' && steps.find-baseline.outputs.result != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          name: coverage-baseline
          path: /tmp/baseline
          run-id: ${{ steps.find-baseline.outputs.result }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare coverage summary
        if: github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const raw = fs.readFileSync('/tmp/coverage.txt', 'utf8');
            const lines = raw.split('\n');

            const parseAllFiles = text => {
              const line = text.split('\n').find(l => l.match(/^All files\s*\|/));
              if (!line) return null;
              const [, stmts, branch, funcs, ln] = line.split('|').map(s => s.trim());
              return {stmts: parseFloat(stmts), branch: parseFloat(branch), funcs: parseFloat(funcs), ln: parseFloat(ln)};
            };

            const current = parseAllFiles(raw);
            let baseline = null;
            try { baseline = parseAllFiles(fs.readFileSync('/tmp/baseline/coverage-summary.txt', 'utf8')); } catch {}

            const stripAnsi = s => s.replace(/\x1b\[[0-9;]*m/g, '');

            const fmt = (val, baseVal) => {
              const str = `**${val.toFixed(2)}%**`;
              if (baseline === null || isNaN(baseVal)) return str;
              const d = val - baseVal;
              if (Math.abs(d) < 0.005) return str;
              const sign = d > 0 ? '+' : '';
              const arrow = d > 0 ? '▲' : '▼';
              return `${str} ${arrow}${sign}${d.toFixed(2)}%`;
            };

            let coverageLine = '_Coverage data not found_';
            if (current) {
              const b = baseline || {};
              coverageLine = [
                `Stmts: ${fmt(current.stmts, b.stmts)}`,
                `Branch: ${fmt(current.branch, b.branch)}`,
                `Funcs: ${fmt(current.funcs, b.funcs)}`,
                `Lines: ${fmt(current.ln, b.ln)}`,
              ].join(' | ');
            }

            const testLine = lines.map(stripAnsi).find(l => l.includes('Test Files')) || '';
            const body = [
              '## Coverage',
              coverageLine,
              testLine.trim() ? `> ${testLine.trim()}` : '',
            ].filter(Boolean).join('\n');

            fs.writeFileSync('/tmp/coverage-pr-summary.md', body);

      - name: Write coverage summary to job summary
        if: github.event_name == 'pull_request'
        run: cat /tmp/coverage-pr-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Post coverage summary to PR
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('/tmp/coverage-pr-summary.md', 'utf8');
            const {data: comments} = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.startsWith('## Coverage'));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  test-headless-shard:
    runs-on: ubuntu-26.04

    strategy:
      # Retain all failure reports even if another shard fails.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Enable Corepack
        run: corepack enable yarn

      - name: Install dependencies
        run: yarn install --immutable
        env:
          YARN_ENABLE_HARDENED_MODE: 0

      - name: Build packages
        run: yarn build

      - name: Install Playwright Chromium
        uses: ./.github/actions/setup-browser

      - name: Run headless browser tests
        id: headless
        run: yarn test-headless --shard=${{ matrix.shard }}/4

      - name: Upload basemap reference-render report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: basemap-reference-render-${{ matrix.shard }}
          path: modules/basemap-layers/tests/reference-render/__output__
          if-no-files-found: ignore

  test-webgpu:
    runs-on: ubuntu-26.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Enable Corepack
        run: corepack enable yarn

      - name: Install dependencies
        run: yarn install --immutable
        env:
          YARN_ENABLE_HARDENED_MODE: 0

      - name: Build packages
        run: yarn build

      - name: Install Playwright Chromium
        id: browser-setup
        uses: ./.github/actions/setup-browser

      - name: Verify WebGPU layers with a required software adapter
        # Unrelated browser failures must not suppress the backend verification.
        # Temporarily skip the edge-on volumetric-video case on software WebGPU:
        # it repeatedly stalls waiting for rendering and times out after 35 seconds.
        # Native browser runs retain the test; keep all other WebGPU checks enabled.
        if: ${{ !cancelled() && steps.browser-setup.outcome == 'success' }}
        run: yarn vitest run --project headless modules/layers/test/webgpu-layers.browser.spec.ts modules/layers/test/splat-layer/webgpu-layers.browser.spec.ts modules/layers/test/selection-pulse-extension/selection-pulse-extension.browser.spec.ts modules/layers/test/tree-layer/webgpu-layers.browser.spec.ts modules/layers/test/flame-trail-layer/flame-trail-layer.browser.spec.ts modules/layers/test/volumetric-video-layer/volumetric-video-layer.browser.spec.ts examples/layers/flame-trail/scene.browser.spec.ts examples/layers/volumetric-video/app.browser.spec.ts -t "^(?!.*keeps the WebGPU raster path for a nearly edge-on automatic volume).*(webgpu|WebGPU)"
        env:
          DECK_GL_COMMUNITY_SOFTWARE_WEBGPU: 'true'

      - name: Check out the upstream WebGPU terrain port
        if: ${{ !cancelled() && steps.browser-setup.outcome == 'success' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: visgl/deck.gl
          # Temporary integration pin until deck.gl#10751 is released.
          ref: 98dbf01f74641c3d12283522bf2e9561fed00d82
          path: .terrain-sdk

      - name: Verify WebGPU terrain fitting against the upstream port
        if: ${{ !cancelled() && steps.browser-setup.outcome == 'success' }}
        run: yarn vitest run --project headless modules/layers/test/flame-trail-layer/flame-trail-layer.browser.spec.ts -t webgpu
        env:
          DECK_GL_SOURCE: ${{ github.workspace }}/.terrain-sdk
          DECK_GL_COMMUNITY_SOFTWARE_WEBGPU: 'true'

  # Preserve the required check name and fail if any browser job fails or is skipped.
  test-headless:
    runs-on: ubuntu-26.04
    needs: [test-headless-shard, test-webgpu]
    if: ${{ always() }}
    steps:
      - name: Require all browser checks
        env:
          SHARDS_RESULT: ${{ needs.test-headless-shard.result }}
          WEBGPU_RESULT: ${{ needs.test-webgpu.result }}
        run: |
          test "$SHARDS_RESULT" = success
          test "$WEBGPU_RESULT" = success

  website-build:
    runs-on: ubuntu-26.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Enable Corepack
        run: corepack enable yarn

      - name: Install root workspace dependencies
        run: yarn install --immutable
        env:
          YARN_ENABLE_HARDENED_MODE: 0

      - name: Install website dependencies
        run: cd website && yarn install --immutable
        env:
          YARN_ENABLE_HARDENED_MODE: 0

      - name: Build website
        run: cd website && yarn build
